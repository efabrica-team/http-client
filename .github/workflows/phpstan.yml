name: PHP static analysis

on:
  push:
    branches:
      - master
  pull_request: null

jobs:
  phpstan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5' ]
        symfony: [ '^7.0', '^8.0' ]
        exclude:
          # symfony/http-client ^8.0 requires PHP >=8.4
          - php: '8.2'
            symfony: '^8.0'
          - php: '8.3'
            symfony: '^8.0'

    name: PHPStan - PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none # disable xdebug, pcov

      - name: Require Symfony ${{ matrix.symfony }}
        run: composer require "symfony/http-client:${{ matrix.symfony }}" "symfony/stopwatch:${{ matrix.symfony }}" --no-update

      - name: Composer update
        run: composer update --no-progress --no-interaction

      - name: PHPStan analyse
        run: vendor/bin/phpstan analyze src --level=8 --no-progress
